version: '3.8'

services:
  django_app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    expose:
      - "8000"  # Открываем порт для Nginx
    environment:
      - DEBUG=0  # Убедитесь, что вы отключили DEBUG в продакшене
      - DB_NAME=order_system_db
      - DB_USER=admin
      - DB_PASSWORD=1234
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: order_system_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static  # Путь к статическим файлам
    ports:
      - "80:80"
    depends_on:
      - django_app

volumes:
  postgres_data:

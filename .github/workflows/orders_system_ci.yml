name: CI

on:
  push:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up PostgreSQL
      uses: harmon758/postgresql-action@v1.0.0
      with:
        postgresql version: 17  # Укажите нужную версию PostgreSQL
        postgresql db: order_system_db  # Укажите имя вашей базы данных
        postgresql user: admin  # Укажите имя пользователя
        postgresql password: 1234 # Укажите пароль пользователя

    - name: Run tests
      run: |
        cd order_system
        python manage.py test